<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Dadu Keberuntungan</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --gold-color: #f59e0b;
      --green-color: #10b981;
      --red-color: #ef4444;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #60a5fa;
      margin-bottom: 12px;
    }

    .balance-box {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--gold-color);
      color: var(--gold-color);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dice-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .dice {
      width: 70px;
      height: 70px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .rolling {
      animation: roll 0.5s infinite linear;
    }

    @keyframes roll {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.9); }
    }

    .bet-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .bet-btn {
      background: #334155;
      border: 2px solid transparent;
      color: #fff;
      padding: 12px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .bet-btn:hover {
      background: #475569;
    }

    .bet-btn.active {
      border-color: var(--accent-color);
      background: #1e3a8a;
    }

    .bet-amount-selector {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .chip-btn {
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--gold-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .chip-btn:hover {
      background: #1e293b;
    }

    .action-btn {
      background: var(--green-color);
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .result-msg {
      margin-top: 16px;
      font-size: 1rem;
      font-weight: bold;
      min-height: 24px;
    }

    .history {
      margin-top: 20px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
    }

    .reset-coins {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎲 Dadu Keberuntungan</h1>

    <!-- Informasi Saldo -->
    <div class="balance-box">
      <span>🪙 Saldo Koin:</span>
      <span id="coins">1,000</span>
    </div>

    <!-- Tampilan Dadu -->
    <div class="dice-area">
      <div class="dice" id="dice1">1</div>
      <div class="dice" id="dice2">1</div>
    </div>

    <!-- Pilihan Taruhan -->
    <div style="font-size: 0.9rem; margin-bottom: 8px; font-weight: 600;">Pilih Prediksi Jumlah:</div>
    <div class="bet-options">
      <button class="bet-btn active" onclick="selectBet('small', this)">
        KECIL<br><small>(2 - 6)</small><br><span style="color: #60a5fa; font-size: 0.75rem;">x2</span>
      </button>
      <button class="bet-btn" onclick="selectBet('seven', this)">
        TUJUH<br><small>(Tepat 7)</small><br><span style="color: #60a5fa; font-size: 0.75rem;">x5</span>
      </button>
      <button class="bet-btn" onclick="selectBet('big', this)">
        BESAR<br><small>(8 - 12)</small><br><span style="color: #60a5fa; font-size: 0.75rem;">x2</span>
      </button>
    </div>

    <!-- Pilihan Jumlah Taruhan -->
    <div style="font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8;">Taruhan Saat Ini: <b id="currentBet">50</b> Koin</div>
    <div class="bet-amount-selector">
      <button class="chip-btn" onclick="addBet(10)">+10</button>
      <button class="chip-btn" onclick="addBet(50)">+50</button>
      <button class="chip-btn" onclick="addBet(100)">+100</button>
      <button class="chip-btn" style="color: var(--red-color);" onclick="resetBet()">Reset</button>
    </div>

    <!-- Tombol Kocok -->
    <button class="action-btn" id="rollBtn" onclick="rollDice()">KOCOK DADU!</button>

    <!-- Pesan Hasil -->
    <div class="result-msg" id="resultMsg"></div>

    <!-- Riwayat Permainan -->
    <div class="history" id="history">
      <div style="text-align: center; color: #64748b;">Belum ada riwayat kocokan.</div>
    </div>

    <button class="reset-coins" onclick="claimDailyCoins()">Klaim 500 Koin Gratis</button>
  </div>

  <script>
    let coins = parseInt(localStorage.getItem('luckydice_coins')) || 1000;
    let currentBetAmount = 50;
    let selectedChoice = 'small'; // 'small', 'seven', atau 'big'
    let isRolling = false;

    const coinsElem = document.getElementById('coins');
    const currentBetElem = document.getElementById('currentBet');
    const resultMsgElem = document.getElementById('resultMsg');
    const dice1Elem = document.getElementById('dice1');
    const dice2Elem = document.getElementById('dice2');
    const historyElem = document.getElementById('history');
    const rollBtn = document.getElementById('rollBtn');

    function updateUI() {
      coinsElem.textContent = coins.toLocaleString();
      currentBetElem.textContent = currentBetAmount.toLocaleString();
      localStorage.setItem('luckydice_coins', coins);
    }

    function selectBet(choice, elem) {
      if (isRolling) return;
      selectedChoice = choice;
      document.querySelectorAll('.bet-btn').forEach(btn => btn.classList.remove('active'));
      elem.classList.add('active');
    }

    function addBet(amount) {
      if (isRolling) return;
      if (currentBetAmount + amount <= coins) {
        currentBetAmount += amount;
      } else {
        currentBetAmount = coins;
      }
      updateUI();
    }

    function resetBet() {
      if (isRolling) return;
      currentBetAmount = 10;
      updateUI();
    }

    function rollDice() {
      if (isRolling) return;
      if (currentBetAmount <= 0) {
        resultMsgElem.style.color = 'var(--red-color)';
        resultMsgElem.textContent = 'Masukkan jumlah taruhan!';
        return;
      }
      if (coins < currentBetAmount) {
        resultMsgElem.style.color = 'var(--red-color)';
        resultMsgElem.textContent = 'Saldo koin tidak cukup!';
        return;
      }

      isRolling = true;
      rollBtn.disabled = true;
      rollBtn.style.opacity = '0.5';
      resultMsgElem.textContent = '';

      // Tampilkan Efek Animasi
      dice1Elem.classList.add('rolling');
      dice2Elem.classList.add('rolling');

      setTimeout(() => {
        const val1 = Math.floor(Math.random() * 6) + 1;
        const val2 = Math.floor(Math.random() * 6) + 1;
        const total = val1 + val2;

        dice1Elem.classList.remove('rolling');
        dice2Elem.classList.remove('rolling');

        dice1Elem.textContent = val1;
        dice2Elem.textContent = val2;

        evaluateResult(val1, val2, total);
        isRolling = false;
        rollBtn.disabled = false;
        rollBtn.style.opacity = '1';
      }, 1000);
    }

    function evaluateResult(val1, val2, total) {
      let outcomeCategory = '';
      if (total >= 2 && total <= 6) outcomeCategory = 'small';
      else if (total === 7) outcomeCategory = 'seven';
      else if (total >= 8 && total <= 12) outcomeCategory = 'big';

      const isWin = selectedChoice === outcomeCategory;
      let multiplier = selectedChoice === 'seven' ? 5 : 2;
      let profit = 0;

      if (isWin) {
        profit = currentBetAmount * (multiplier - 1);
        coins += profit;
        resultMsgElem.style.color = 'var(--green-color)';
        resultMsgElem.textContent = `MENANG! +${profit.toLocaleString()} Koin (Total: ${total})`;
      } else {
        profit = -currentBetAmount;
        coins -= currentBetAmount;
        resultMsgElem.style.color = 'var(--red-color)';
        resultMsgElem.textContent = `KALAH! -${currentBetAmount.toLocaleString()} Koin (Total: ${total})`;
      }

      if (coins < currentBetAmount) {
        currentBetAmount = Math.max(10, coins);
      }

      addHistory(total, isWin, isWin ? profit : -currentBetAmount);
      updateUI();
    }

    function addHistory(total, isWin, change) {
      const item = document.createElement('div');
      item.classList.add('history-item');
      
      const resultText = isWin ? `MENANG (+${change})` : `KALAH (${change})`;
      const color = isWin ? 'var(--green-color)' : 'var(--red-color)';

      item.innerHTML = `
        <span>Hasil: <b>${total}</b></span>
        <span style="color: ${color}">${resultText}</span>
      `;

      if (historyElem.children[0] && historyElem.children[0].innerText.includes('Belum ada')) {
        historyElem.innerHTML = '';
      }

      historyElem.prepend(item);
    }

    function claimDailyCoins() {
      coins += 500;
      updateUI();
      resultMsgElem.style.color = 'var(--gold-color)';
      resultMsgElem.textContent = 'Berhasil klaim +500 Koin gratis!';
    }

    // Inisialisasi awal
    updateUI();
  </script>
</body>
</html>
